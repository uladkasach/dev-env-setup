# desert.conf
# desert palette from gogh
# ref: https://github.com/Gogh-Co/Gogh/blob/master/themes/Desert.yml

# interface
foreground           #ffffff
background           #333333
cursor               #ffffff
cursor_text_color    #333333
selection_foreground #333333
selection_background #555555

# 16-color palette (ANSI)
# black
color0  #4d4d4d
color8  #555555
# red
color1  #ff2b2b
color9  #ff5555
# green
color2  #98fb98
color10 #55ff55
# yellow
color3  #f0e68c
color11 #ffff55
# blue
color4  #cd853f
color12 #87ceff
# magenta
color5  #ffdead
color13 #ff55ff
# cyan
color6  #ffa0a0
color14 #ffd700
# white
color7  #f5deb3
color15 #ffffff

# tab bar
#   - the active tab inverts: dark text on the wheat accent #f5deb3
#   - an inactive tab blends flat into the bar, since its bg is the terminal background
#   - so the inversion is the only cue, with no divider and no box
#   - active_tab_font_style normal drops kitty's default bold-italic
active_tab_foreground   #333333
active_tab_background   #f5deb3
active_tab_font_style   normal
inactive_tab_foreground #f5deb3
inactive_tab_background #333333
inactive_tab_font_style normal
