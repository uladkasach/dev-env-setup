# kitty.conf
# ref: https://sw.kovidgoyal.net/kitty/conf/

# font
font_family      Hack Nerd Font Mono
font_size        12.0

# theme
include themes/desert.conf

# remote control — opt-in per terminal, for security
#   - the socket is always created; a command is accepted only when a launch grants it
#   - usage: kitty --allow-remote-control &
#   - the abstract socket (@) lives in the kernel, so flatpak reaches it
#
# 🛑 the `@` form has NO filesystem permissions
#   - any uid in this network namespace can connect to it
#   - inert ONLY here, because `allow_remote_control no` refuses every command
#   - ⇒ never copy this `@` form to a launch that turns remote control ON
#   - `termwork.sh` passes `-o allow_remote_control=socket-only`, so its socket IS the grant
#   - it overrides listen_on with an $XDG_RUNTIME_DIR path (0700, per-user)
#   - read the 🛑 block at its spawn site before you touch either value
allow_remote_control no
listen_on unix:@kitty-{kitty_pid}

# window
#
# 🛑 `remember_window_size` defaults to YES and OVERRIDES both sizes below
#   - kitty then reuses the geometry of the last window CLOSED
#   - ⇒ size is cached state, never a declaration
#   - drag one window small and every window after it inherits that, forever
#   - no code changes, so no diff explains it
#
# ⚠️ not cosmetic — measured 2026-09-03, a 6-tree fleet
#   - zero windows at the declared size; worst 27 cols
#   - tmux tracks its client, so a narrow pane wraps claude's modal chrome:
#     `2. Yes, and…` → `2Yes, and…`
#   - ⇒ a stall detector keyed on that chrome read a LIVE MODAL as an idle box
#   - the two healthiest sessions were the two with NO terminal attached
#
# ⚠️ duct windows were never at risk
#   - `src/termwork.sh` passes `-o remember_window_size=no` on every spawn
#   - a launch's `-o` outranks this file
#   - ⇒ this line covers the windows a HUMAN opens
remember_window_size no
initial_window_width  140c
initial_window_height 74c
window_padding_width 4
hide_window_decorations no
# confirm a close when a foreground program (nvim, claude) is active
#   - -1 = confirm only for a non-shell program, so a bare shell closes silent
#   - 0 = never confirm
#   - positive N = confirm past N windows
confirm_os_window_close -1

# cursor
cursor_shape block
cursor_blink_interval 0

# scrollback
scrollback_lines 10000

# touchpad scroll speed
#   - kitty maps hi-res touchpad deltas 1:1 by default (multiplier 1.0)
#   - that feels sluggish next to gnome apps, which accelerate
touch_scroll_multiplier 3.0

# title ownership — the shell owns the OS window title
#   - kitty's shell integration would set its own title
#   - that fights zsh's _set_terminal_title (OSC 2, re-asserted on every precmd)
#   - no-title makes the shell authoritative, so pwd/repo:branch stays in the title
shell_integration no-title

# keybinds — the gnome/VTE bindings this human's hands already know
#   - ctrl+shift+t/w/c/v and alt+N, adopted to keep muscle memory off a VTE terminal
clear_all_shortcuts yes

# clipboard
#   - ctrl+shift+c runs the same kitten as ctrl+c, so both copy, toast, and gate alike
#   - builtin copy_to_clipboard would skip the toast and the forward
map ctrl+shift+c kitten copy_notify.py
map ctrl+shift+v paste_from_clipboard
# ctrl+c copies kitty's own selection AND forwards CSI 99;6u to nvim ONLY
#   - the forward is never the ^C byte, and it reaches an allowlist alone
#   - 🛑 so ctrl+c can NEVER interrupt any receiver (claude-cli, shells, other TUIs)
#   - the sole interrupt key stays ctrl+x
map ctrl+c kitten copy_notify.py
# ctrl+v pastes, unconditionally (desktop parity)
#   - kitty grabs it globally, so it shadows shell quoted-insert (rare)
#   - nvim's own <C-v> maps stay as the fallback for non-kitty terminals
map ctrl+v paste_from_clipboard
# ctrl+x sends ^C (SIGINT) — the sole interrupt key, and the ^C escape in a TUI
map ctrl+x send_text all \x03

# mouse — kitty keeps native selection even while an app has grabbed the mouse
#   - tmux runs `mouse on` for its 50k scrollback, which sets the "grabbed" state
#   - kitty's default there hands left-drag to the app
#   - these overrides claim left-drag for kitty's OWN selection under grabbed
#   - a highlight then sticks with no modifier and copy_notify.py can mirror it
#   - the wheel stays unmapped, so the app that holds the grab still gets it
#   - "grabbed" is app-agnostic, so nvim gets kitty-native selection too
mouse_map left press grabbed mouse_selection normal
mouse_map left doublepress grabbed mouse_selection word
mouse_map left triplepress grabbed mouse_selection line

# tabs
#   - new_tab starts at kitty's own launch cwd (usually ~), which loses the pwd
#     of the tab it was spawned from — launch --cwd=current inherits it instead
map ctrl+t launch --type=tab --cwd=current
map ctrl+shift+h previous_tab
map ctrl+shift+l next_tab
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab
map ctrl+shift+w close_tab
map ctrl+o select_tab

# jump to tab N by ordinal position
#   - goto_tab is 1-indexed and positional, so it tracks tab bar order
#   - it does NOT track the termwork --tab slug
#   - ctrl+0 jumps to the last tab, whatever the count
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9
map ctrl+0 goto_tab -1

# tab title — mirror the shell-set OSC title, so tab bar reads as titlebar
#   - {title} is that string, since shell_integration no-title gave the shell it
#   - {title:^14} center-pads to a 14-wide field, so every tab is equal width
#   - a title longer than 14 grows as needed
#   - the literal space each side guarantees ≥1 space at ANY length
tab_title_template " {title:^14} "

# tab bar style — flat, no divider
#   - `separator` drops kitty's default `fade` gradient edges
#   - an empty tab_separator removes the character between tabs entirely
#   - so the only cue for the active tab is its inverted color (desert.conf)
tab_bar_style separator
tab_separator ""

# scroll
map ctrl+shift+k scroll_page_up
map ctrl+shift+j scroll_page_down

# window management
#   - --cwd=current inherits the pwd of the active window, via shell integration
map ctrl+backslash launch --type=os-window --cwd=current

# ctrl+shift+r force-reboots the active window's process
#   - kitty-side parity with tmux's duct reboot (respawn-pane -k)
#   - it SIGKILLs a wedged nvim and respawns a shell at the same cwd and tab
#   - kitty grabs the key before the child sees it, so it fires on a hung child
#   - 🛑 reboot at the LEAF holder, so the kitten checks for tmux first
#   - on a hit it re-emits CSI 114;6u for tmux's own `-n C-S-r respawn-pane`
#
# 🛑 ctrl+alt+r and ctrl+super+r belong to NVIM (copy relpath, src/init.lua)
#   - ⇒ never claim either here to reach for a second reboot key
#   - ctrl+alt+r carries no map, so it reaches the child intact
#   - ctrl+super+r IS mapped, and that map exists to DELIVER it — see below
map ctrl+shift+r kitten reboot_window.py

# 🛑 ctrl+super+r is rewritten to ctrl+alt+r, because TMUX HAS NO SUPER
#
# .the break
#   tmux's key model holds exactly three modifiers — `C-`, `M-`, `S-`
#   (tmux/tmux wiki, "Modifier Keys"). there is no super, in ANY version. so
#   `ctrl+super+r` (kitty protocol mods param 13 = ctrl|super) sits outside the
#   range tmux parses; it discards the modifiers and forwards the bare base key.
#   nvim then sees a plain `r`, which in normal mode is the REPLACE operator —
#   so the keymap never fires AND a stray edit is one keystroke away.
#
# ⚠️ measured 2026-09-03 on a duct, twice and independently:
#     - fed `CSI 114;13u` into a real tmux client → nvim received `r` [72]
#     - a human pressed ctrl+super+r over ssh    → nvim received `r` [72]
#   `ctrl+shift+c` (param 6) crosses untouched, so this is the SUPER BIT alone,
#   never CSI-u as such.
#
# 🛑 do NOT reach for a tmux option or a tmux upgrade. `extended-keys-format
#   csi-u` (3.5+) changes the form tmux EMITS; it hands tmux no super to emit.
#   a `bind` cannot help either — by the time one could match, tmux has already
#   discarded the modifier it never understood.
#
# .why the fix is HERE
#   kitty is the last layer that can still SEE super, so the substitution
#   belongs upstream of the break (`rule.require.solve-at-cause`).
#
# ⚠️ `send_key`, NEVER `send_text` — this is the load-bear choice
#   - `send_key` makes kitty ENCODE ctrl+alt+r with whatever protocol the
#     RECEIVING app negotiated: nvim gets the CSI-u form it asked for, a shell
#     gets the legacy form it understands
#   - `send_text` writes ONE fixed byte string to every app, so it would be
#     right for nvim and literal garbage at a shell prompt
#   - ⇒ each app is sent a different form, so only an action that re-encodes
#     per app can be right
#
# .what this costs
#   ctrl+super+r now behaves EXACTLY as ctrl+alt+r, everywhere — which is the
#   intent: src/init.lua points both at the same copy_relpath.
#
# .requires kitty >= 0.33 for `send_key`. this bundle pins 0.47.4.
map ctrl+super+r send_key ctrl+alt+r

# font size
#   - ctrl+0 is reassigned to goto_tab above, so the size reset moves to ctrl+shift+0
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0

# key remaps
#   - ctrl+j sends shift+enter, from the home row
#   - so an app that treats shift+enter specially (newline vs submit) is reachable
map ctrl+j send_key shift+enter

# misc
map ctrl+shift+f5 load_config_file
