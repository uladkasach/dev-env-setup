# tmux config for ductwork
# prefix: ctrl+x (instead of ctrl+b)
set -g prefix C-x
unbind C-b
bind C-x send-prefix

# mouse ON so tmux owns the wheel: wheel-up enters copy-mode and scrolls the 50k
# scrollback natively (no more kitty alternate_scroll that fakes arrow keys at the
# prompt). the catch this used to cause — tmux pulled left-drag into copy-mode,
# so a highlight vanished on release — is handled on the kitty side: kitty's
# mouse_map claims left-drag for its OWN selection even while tmux holds the mouse
# grab (declared by the 4.3.2.emulator bundle), so the highlight sticks and ctrl+c
# still copies + toasts + forwards. net: kitty owns selection (left button), tmux
# owns scroll (wheel) — both native, no modifier. tmux only forfeits left-CLICK
# pane ops (focus/resize/status-click), unused here since it runs one pane per
# window.
set -g mouse on

# increase scrollback buffer
set -g history-limit 50000

######################################################################
# status line: repo on the left, branch on the right
######################################################################
# the shell (_set_terminal_title in zshrc) already computes $repo and $branch as
# separate values. inside tmux it pushes them straight to these pane options, so
# tmux just reads them — no string parse, no git subprocess on a status refresh.
# (tmux reserves ':' as its own separator inside #{s/.../.../}, so a re-split of a
# "repo:branch" string here is impossible; separate options sidestep that entirely.)
# @repo/@branch are empty until the shell sets them (fresh pane, non-git dir).
set -g status-left  " #{@repo} "
set -g status-right " #{@branch} "
set -g status-left-length 40
set -g status-right-length 60

# blank the middle window-status list (the "0:zsh*" index:name+flags segment) —
# with one tmux window per duct it is just noise; the kitty tabs are the real
# window switcher. this leaves the status line as: repo (left) ... branch (right).
set -g window-status-format ""
set -g window-status-current-format ""

# allow kitty graphics protocol passthrough (for image.nvim to render pngs in nvim)
set -gq allow-passthrough on
set -g visual-activity off
set-option -g focus-events on

######################################################################
# clipboard: relay the kitty keyboard protocol + clipboard through tmux
######################################################################
# without this, kitty -> tmux -> nvim copy is dead. the copy path (kitty's
# copy_notify.py) forwards ctrl+shift+c as CSI 99;6u only when the child app has
# the kitty keyboard protocol on, and nvim yanks on <C-S-c> (not the ^C byte).
# with tmux in the middle, kitty's child is tmux — so tmux must relay nvim's
# protocol request upward (to unblock the kitten's forward gate) AND deliver the
# extended key downward to nvim. extended-keys is the critical line.
# (requires tmux >= 3.2; these are server options — apply live with
#  `tmux source-file ~/.tmux.conf`, then detach+reattach so the client
#  re-negotiates terminal-features. no server kill needed.)
set -s extended-keys on
set -as terminal-features 'xterm-kitty:extkeys'

# 🛑 tmux is the GATE on the copy forward, because tmux is where the answer is
#
# .why the gate moved here
#   - kitty's kitten walks LOCAL /proc to name the focused app
#   - over ssh this box holds only the ssh client, so every local reader
#     answers 'ssh' and the kitten's allowlist rejected it
#   - ⇒ a visual-mode ctrl+c was a silent no-op on every remote duct
#   - ⚠️ it read as healthy: kitty's own mouse-drag copy still fired and still
#     toasted, so one live path masked one dead one
#
# .why this line is the right place
#   - tmux runs ON the far host, so `pane_current_command` is a FACT here,
#     never an inference across a pipe
#   - one gate serves both ducts: local and remote take the same branch
#   - kitty now DELIVERS unconditionally past its own allowlist; this decides
#
# ⚠️ a root (`-n`) bind swallows the key for every app in the session, so the
#   re-emit is what hands it to nvim. drop that and copy dies everywhere,
#   local included.
# ⚠️ this needs `extended-keys` above: without it tmux cannot tell C-S-c from
#   C-c, and a root bind on C-c would eat every interrupt in the session.
#
# 🛑 `-H` with raw bytes, NEVER `send-keys C-S-c` — measured 2026-09-03
#   - 1b 5b 39 39 3b 36 75 = ESC [ 9 9 ; 6 u, the byte copy_notify.py emits
#   - `send-keys C-S-c` asks tmux to ENCODE an extended key into the pane, and
#     tmux 3.2a cannot: the bind fired, the condition matched, and nvim saw
#     no key at all. `-H` writes bytes, so no encoder sits in the path
#   - measured on both a minimal init and the real one, so it is the ENCODE,
#     never nvim's config
#   - ⇒ `-H` is also the truer form: the pane sees the exact byte kitty sends,
#     whether the duct is local or remote
bind -n C-S-c if -F '#{m:*nvim*,#{pane_current_command}}' 'send-keys -H 1b 5b 39 39 3b 36 75'

# route OSC 52 clipboard writes (nvim's + register) out through kitty to the
# system clipboard, so a yank inside tmux lands on the desktop clipboard.
set -s set-clipboard on
set -as terminal-features 'xterm-kitty:clipboard'

######################################################################
# what $TERM every PANE gets
######################################################################
# tmux's built-in default is `screen` — 8 colours. every pane inherits it at
# spawn, so an app inside tmux reads TERM=screen, concludes the terminal holds
# 8 colours, and EMITS only 8-colour codes. no option downstream can recover a
# colour the app never sent.
#
# ⚠️ this is the INSIDE half of a pair, and the halves are independent:
#      default-terminal   → what an app INSIDE a pane believes it talks to
#      terminal-features  → what tmux believes the OUTER terminal can render
#
#    measured 2026-09-03 on grove-ahbode-v20260901 (tmux 3.2a): RGB was asserted
#    and correct below, and `default-terminal` still answered `screen`. so the
#    outward path was fixed while colour stayed clamped at its source. one half
#    green is not the claim — a reader who checks only the RGB line above sees a
#    converged conf and a box that still renders 8 colours.
#
# `tmux-256color` ships in `ncurses-base` (priority: required) — measured with
# `dpkg -S /lib/terminfo/t/tmux-256color` — and debian is an invariant here
# (grove.pkg.sh), so every box this repo targets holds the entry. configure.verify
# asserts it rather than assumes it, and reads the name out of THIS line so the
# declaration and its check cannot drift.
#
# ⚠️ do NOT swap in `screen-256color`: it is the older entry, and it carries
#    neither italics nor extended keys — and extkeys is what the clipboard path
#    below depends on.
set -g default-terminal 'tmux-256color'

######################################################################
# truecolor: ASSERT that the outer terminal is RGB
######################################################################
# without this a REMOTE duct renders truecolor wrong — orange reads red, red
# reads purple. the colors are not dropped, they are DOWNSAMPLED: tmux quantises
# every 24-bit SGR to the nearest slot of a palette it believes is 8/16 colors.
# a hue SHIFT is the signature of that quantise; a total loss would be monochrome.
#
# tmux flags a client RGB from either the outer TERM's terminfo or $COLORTERM.
# locally kitty supplies both, so autodetect wins and truecolor passes — which is
# why this stayed invisible until a duct went over ssh. ssh forwards TERM and
# DROPS COLORTERM (it relays only what SendEnv/SetEnv name, and COLORTERM is in
# neither default set), so the remote client loses the signal and never gets flagged.
#
# measured 2026-09-03, grove-ahbode-v20260901, both attached clients:
#   term=xterm-kitty feats=bpaste,ccolour,clipboard,cstyle,extkeys,focus,title
#                                         ↑ clipboard + extkeys present, RGB absent
#
# ⚠️ read that list as the PROOF of the mechanism, not merely the symptom:
#    `clipboard` and `extkeys` are present precisely BECAUSE the two lines above
#    assert them for xterm-kitty. every feature this file names crossed the ssh
#    boundary; the one it left to autodetect did not. an assertion travels because
#    it lives in the config — an env var does not survive the hop.
#
# ⇒ so the fix is to state the capability rather than infer it. kitty is truly
#   truecolor on both sides, so the claim is correct locally too, and asserting it
#   changes no local behavior — autodetect had already reached the same answer.
set -as terminal-features 'xterm-kitty:RGB'

######################################################################
# force-reboot the duct's pane (ctrl+shift+r)
######################################################################
# hard-reboot whatever runs in the active pane — SIGKILL it (e.g. a wedged nvim
# that will not :q) and respawn a fresh login shell at the same pwd. the duct
# (this tmux session) and the attached kitty tab both survive; you just land at
# a clean prompt in the same directory.
# - works even when nvim is fully hung: tmux kills the pane process from the
#   OUTSIDE, so it needs no keystroke that a stuck nvim would fail to read.
# - -k kills the current process; -c "#{pane_current_path}" reopens at its cwd.
# - the fresh shell is a plain login shell in the duct; it re-attaches no state.
# bound as a root (no-prefix) key, so it fires from any app in the session. this
# is only unambiguous because extended-keys (above) lets tmux tell ctrl+shift+r
# from ctrl+r — without it the two would collide. the tradeoff: apps in the
# session (incl. nvim) never see ctrl+shift+r, which is fine (nvim does not use it).
#
# 🛑 that swallow is why ctrl+alt+r and ctrl+super+r must stay UNBOUND here
#   - both belong to nvim (copy relpath, src/init.lua)
#   - a `bind -n` on either would eat the keymap with no error and no log
bind -n C-S-r respawn-pane -k -c "#{pane_current_path}"

######################################################################
# plugins (via tpm)
######################################################################

# plugin manager
set -g @plugin 'tmux-plugins/tpm'

# resurrect: save/restore sessions across restarts
# prefix + ctrl+s to save, prefix + ctrl+r to restore
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'

# continuum: auto-save every 15min, auto-restore on tmux start
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# init tpm (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
