// grove: owned by dev-env-setup, bundle 1.14.updates — never edit on the box.
// read ONLY where APT_CONFIG names it: the apt-daily-upgrade.service drop-in does,
// so the unattended run keeps a locally edited conffile (4.5.nvim fences its rules into
// imagemagick's policy.xml) rather than skip that security update forever.
// a human's own apt run never reads this file, and still asks.
Dpkg::Options { "--force-confdef"; "--force-confold"; };