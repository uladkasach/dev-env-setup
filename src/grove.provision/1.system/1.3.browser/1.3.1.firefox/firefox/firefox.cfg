// firefox.cfg — first line is ignored by the autoconfig parser
try {
  // rebind key_selectTab1..8 + key_selectLastTab from alt (linux default)
  // to accel (ctrl), move close-tab to ctrl+q, then force gecko to rebuild
  // the shortcut table.
  const rebind = (win) => {
    try {
      if (win.location.href !== "chrome://browser/content/browser.xhtml") return;
      const doc = win.document;
      const keyset = doc.getElementById("mainKeyset");
      if (!keyset) return;
      for (let i = 1; i <= 8; i++) {
        const k = doc.getElementById("key_selectTab" + i);
        if (k) k.setAttribute("modifiers", "accel");
      }
      const last = doc.getElementById("key_selectLastTab");
      if (last) last.setAttribute("modifiers", "accel");
      // close-tab moves from ctrl+w to ctrl+q.
      // .why = ctrl+w is delete-word in the terminal, so a habit hit here
      //        must not close the tab. ctrl+q (quit, by default) is freed
      //        first, so the two keys never race; quit stays in the menu
      const quit = doc.getElementById("key_quitApplication");
      if (quit) quit.remove();
      const close = doc.getElementById("key_close");
      if (close) {
        // fluent owns the key letter via data-l10n-id; drop the id so a
        // re-translate cannot restore "W"
        close.removeAttribute("data-l10n-id");
        close.setAttribute("key", "Q");
      }
      // re-append the keyset node so gecko re-registers the mutated keys
      keyset.parentNode.appendChild(keyset);
    } catch (e) { Cu.reportError("[ctrlN rebind win] " + e); }
  };

  // rebind any already-open browser windows
  const en = Services.wm.getEnumerator("navigator:browser");
  while (en.hasMoreElements()) rebind(en.getNext());

  // rebind future windows once their dom is ready
  Services.obs.addObserver({
    observe(subject, topic) {
      if (topic !== "domwindowopened") return;
      subject.addEventListener("load", () => rebind(subject), { once: true });
    }
  }, "domwindowopened");
} catch (e) {
  Cu.reportError("[ctrlN rebind] " + e);
}

// github refs typed into the urlbar — `owner/repo#123` opens that pull request.
// .why = robots print refs in this shape all day; a hand translation into a url
//        on every one is pure friction
// .how = firefox reads `owner/repo#123` as a search (the host has no dot), so
//        the search page load is caught at the network layer and redirected
//        before it leaves the box. any engine works: every query param is read.
//        a fixup into `http://owner/repo#123` is caught too, for the same reason
// .note = /pull/N for an issue number is redirected by github to /issues/N
// .note = a ref copied from prose carries its sentence's punctuation, so a
//         trailed `.` `,` `;` `:` `!` `?` `)` (and a led `(`) is dropped
try {
  const GH_REF = /^\s*\(?([A-Za-z0-9][A-Za-z0-9-]*)\/([A-Za-z0-9._-]+)#(\d+)[.,;:!?)]*\s*$/;

  // .what = the github url for a typed ref, or null
  const asGithubUrl = (text) => {
    const m = GH_REF.exec(text);
    return m ? "https://github.com/" + m[1] + "/" + m[2] + "/pull/" + m[3] : null;
  };

  // .what = the github url a top-level load stands for, or null
  const asGithubUrlFromUri = (uri) => {
    // shape 1: a search, whose query param holds the typed ref
    for (const pair of (uri.query || "").split("&")) {
      const eq = pair.indexOf("=");
      if (eq < 0) continue;
      let value;
      try { value = decodeURIComponent(pair.slice(eq + 1).replace(/\+/g, " ")); }
      catch (e) { continue; }
      const url = asGithubUrl(value);
      if (url) return url;
    }

    // shape 2: a fixup into http://owner/repo#123 (dotless host, one segment)
    const host = uri.host || "";
    if (host.includes(".") || host === "localhost") return null;
    return asGithubUrl(host + uri.filePath + "#" + (uri.ref || ""));
  };

  Services.obs.addObserver({
    observe(subject, topic) {
      if (topic !== "http-on-modify-request") return;
      try {
        const channel = subject.QueryInterface(Ci.nsIHttpChannel);
        const type = channel.loadInfo && channel.loadInfo.externalContentPolicyType;
        if (type !== Ci.nsIContentPolicy.TYPE_DOCUMENT) return;
        const url = asGithubUrlFromUri(channel.URI);
        if (url) channel.redirectTo(Services.io.newURI(url));
      } catch (e) { Cu.reportError("[github ref redirect req] " + e); }
    }
  }, "http-on-modify-request");
} catch (e) {
  Cu.reportError("[github ref redirect] " + e);
}
