# /etc/systemd/system/user@.service.d/10-revive.conf
# declared by dev-env-setup, bundle 1.6.5.usermanager — the next apply overwrites an edit here
#
# .what = when a user's systemd manager dies, the system manager starts it again
#
# .why  = a dead user manager takes the session bus with it, so every
#         `systemd-run --user` caller (the `nvim` and `claude` wrappers) fails
#         with "Failed to connect to bus: Connection refused" until a re-login.
#         measured 2026-10-07: earlyoom SIGTERMed systemd --user under memory
#         pressure, the unit stopped clean, and no unit brought it back
#
# ⚠️ .why `always` and not `on-failure`
#   a SIGTERM from earlyoom ends the manager CLEAN, so on-failure never fires.
#   a logout is an explicit stop job, and Restart= never applies to an explicit
#   stop — so `always` revives a killed manager and still lets a logout end it
[Service]
Restart=always
RestartSec=2s
