always:
  briefs:
    # essential — persistent rules + repo context, always in context
    say:
      # the map of the tree, and the index of the briefs dir beside it
      - briefs/repo.overview.md
      - briefs/.readme.md
      - briefs/grove/provision/rule.require.install-via-procedures.md
      - briefs/grove/provision/rule.require.repo-as-source-of-truth.md
      - briefs/grove/provision/rule.require.every-function-has-a-driver.md
      - briefs/evidence/rule.require.solve-at-cause.md
      # ⚠️ say-level on purpose. its full ref-level form
      # (rule.require.prove-each-bundle-plan-apply-apply) was booted as NEITHER
      # say nor ref, so it was never in context — and the anti-pattern it forbids
      # recurred on 2026-07-30 and again on 2026-07-31. a rule that is not loaded
      # is a rule that does not exist
      - briefs/grove/provision/rule.require.prove-changes-on-a-grove.md
      # ⚠️ say-level for the same reason as the rule above it. it names the ONE
      # slug every github consumer reads, and the `@all` requirement that a robot
      # has now been tempted to quietly swap for `@this` — because `@this` reads
      # today and `@all` does not. a requirement that is not loaded is a
      # requirement that gets optimized away by whoever meets the blocker next
      - briefs/creds/rule.require.github-token-at-all-camp.md
      # ⚠️ say-level for the THIRD instance of the same failure. this rule was
      # written, was correct, named its own four slip-vectors — and was booted as
      # NEITHER say nor ref, so it was never in context. a blind red-team sweep on
      # 2026-08-08 then found 21 dox findings across ~30 files: in the briefs
      # written that same week, in the file that sits directly beside this rule,
      # and in shipped src/. the rule predicted every vector and stopped none.
      # ⇒ a rule that is not loaded is a rule that does not exist
      - briefs/creds/rule.forbid.dox-in-public-repo.md
      # ⚠️ say-level, and the FOURTH instance of the failure the comment above
      # describes. on 2026-08-09 a relayed verb (`git.grove.rebuild`) was written
      # into a brief, then cited from that brief as grounds to itemize a domain
      # term, then a play was renamed to match — for an operation that exists in
      # no skill here. one glob disproved it, run only when a human asked.
      #
      # its near neighbour, gotcha.a-check-that-cries-wolf-gets-silenced, was ALSO
      # booted as neither say nor ref at the time — and it carried the very test
      # (does the evidence agree with the verdict?) that would have caught this.
      # both are now loaded.
      # ⇒ a check you cannot recall is a check you will not run
      - briefs/evidence/gotcha.my-own-note-became-my-evidence.md
      - briefs/evidence/gotcha.a-check-that-cries-wolf-gets-silenced.md
      # ⚠️ say-level because the trap it names is reached by the DEFAULT path.
      # `git.grove.send` without --bare returns the SEND's exit code, not the
      # command's — so a remote check built the obvious way reports ✔ on a box
      # it never questioned. a ladder written on 2026-08-10 printed three such
      # rows about a box that held no checkout at all. a ref-level brief would
      # be read after the mistake; this one has to be read before it
      - briefs/grove/reach/gotcha.the-duct-returns-the-send-not-the-answer.md
      # ⚠️ say-level because it is INVISIBLE at a keyboard. every tool this repo
      # installs reaches PATH from ~/.zshrc, which zsh reads for an interactive
      # shell alone — so a component that names its dependency by PATH answers a
      # human and is absent for ssh, cron, and every suite. on 2026-08-10 one
      # `git ls-remote` walked four rungs of it in a row, and each error named a
      # symptom rather than a PATH. a robot who has not read this first will
      # "fix" it with a FIFTH PATH declaration
      - briefs/shell/gotcha.a-tool-found-by-path-answers-only-a-human.md
      # ⚠️ say-level because a reader who meets it AFTER the fact reproduces it in
      # the very edit that repairs it. that is measured, not feared: on 2026-08-11
      # the repair for instance 1 WAS instance 2, written by an author who had just
      # described the defect in a comment block one screen above — and the repair
      # for instance 2 was instance 3. three writers in one hour, each converged
      # the field it read and silently blanked every field it did not.
      # ⇒ a partial comparison is not a smaller whole comparison; it is the same
      #   bug at a narrower radius, and every instance printed a success line
      - briefs/evidence/gotcha.a-partial-write-discards-what-it-never-read.md
      # ⚠️ say-level, and it is the LOUDEST rule here on purpose. on 2026-08-10 a
      # robot wrote a `repair.*` play to write machine state, then reached to grow
      # `git.grove.send --set MODE=apply` so the play could apply — a change to the
      # TRANSPORT to make a forbidden act convenient. the human caught both with
      # one question: "why wouldn't it just be via grove.provision?"
      #
      # rule.require.grove-provision-as-the-only-entrypoint already forbade it, in
      # those words, and was booted as `say` at the time. it still lost — because it
      # is a long brief about ENTRYPOINTS, and a play does not look like one.
      # ⇒ so this rule states the same invariant in the shape the mistake takes:
      #   A PLAY MAY NEVER WRITE. and it names the eight past repair plays that
      #   taught the wrong lesson by example for months.
      - briefs/grove/play/rule.forbid.repair-plays.md
      # ⚠️ say-level, both of them, and for a NEW failure mode — not "the rule was
      # never loaded" (the four comments above) but "the rule WAS loaded, read, and
      # its blockers filed as tasks anyway".
      #
      # rule.forbid.repair-plays stated the bar (ssh → push → grove.provision, no
      # step 4) at say-level the whole time. on 2026-08-12 a fresh grove took four
      # hand steps and three applies, and all four defects were filed as #73/#75/
      # #77/#78 rather than fixed. #73 even had its wrong REASON corrected in a
      # careful ⚠️ block while the defect itself stayed in place.
      #
      # ⇒ the bar needed to be its OWN rule, citable without a hunt through a rule
      #   about plays — and it needed a twin that forbids the backlog entry,
      #   because a task restates a `blocker` as an `unresolved` and the session
      #   then moves on with a clear conscience
      - briefs/grove/provision/rule.require.one-command-provision.md
      - briefs/grove/provision/rule.forbid.deferred-provision-defects.md
      # ⚠️ say-level because it bans a form the repo TAUGHT. on 2026-09-03 the
      # human read a `bash …/grove.provision._.sh` line in a fix-text I had just
      # written and banned it outright: "you must use rhx git.grove.provision
      # instead exclusively."
      #
      # the path form sat in ~140 tracked files, INCLUDING the `.the rule` table
      # of rule.require.grove-provision-as-the-only-entrypoint — so the rule that
      # declares the one door named the wrong handle, and every reader who copied
      # a worked example inherited it. a ref-level ban would lose to that, because
      # the wrong form is what a reader meets first.
      #
      # ⇒ it is its own rule, and not a clause of the entrypoint rule, because the
      #   two govern different axes: that one binds the DRIVER (one inventory),
      #   this one binds the SURFACE (one invocation). the driver is unchanged
      - briefs/grove/provision/rule.forbid.the-driver-by-path.md
      # ⚠️ say-level, and for a FIFTH variant of the failure the comments above
      # name four times. those four all read "the rule was never loaded". this one
      # is the harder case: the rule IS loaded, and is not BOUND.
      #
      # settings.json boots repo=ehmpathy/role=mechanic on every session here, so
      # its whole lang.prose cluster — brevity, rambles, chronological-accretion,
      # wick-dense — is in context, always, at say level. the four largest briefs
      # in this dir still grew past 900 lines with all of it loaded, because an
      # author reads those as the MECHANIC's rules for the MECHANIC's artifacts,
      # and a brief under role=any is another role's file.
      #
      # a reviewer had the same gap from the other side: no citation to raise.
      # ⇒ this rule is that citation, and it must be booted for the same reason
      #   every rule above it is — an unbound rule and an unloaded one govern
      #   exactly as much
      - briefs/prose/rule.require.briefs-obey-the-prose-rules.md
      # ⚠️ say-level because a ref-level form of this rule arrives TOO LATE. it
      # governs the instant BEFORE a raw command is typed, and a brief fetched
      # on demand is fetched after — once the adhoc call already ran.
      #
      # measured 2026-09-03: `term.*` held 0 skills while its peer `duct.*` held
      # 8, so a kitty window was opened by a raw `kitty --detach -e ssh`. the two
      # rules that should have caught it are BOTH ref-level, and one of them
      # granted the exact escape hatch used ("it genuinely will not recur").
      # ⇒ the human's line: "if you cant entool it, why do you do it"
      - briefs/shell/rule.forbid.adhoc-shell.md

    # reference — fetch on demand
    ref:
      # the grove family, in the order a traveler meets it
      - briefs/grove/reach/howto.add-a-new-grove.md
      - briefs/grove/reach/howto.grove-ready-test.md
      - briefs/grove/reach/howto.adopt-a-replacement-grove.md
      # how a box is made current — and why `pnpm install` is NOT that
      - briefs/shell/howto.rhx-upgrade.md
      # the proof loop, in full — the say-level rule above points here
      - briefs/grove/provision/rule.require.prove-each-bundle-plan-apply-apply.md
      - briefs/grove/provision/howto.prove-bundles-plan-apply-apply.md
      # ⚠️ the long half of gotcha.a-check-that-cries-wolf-gets-silenced, which is
      # say-level. the say half holds the twelve QUESTIONS and m.13; this file
      # holds the twelve measurements each question was cut from. a reader reaches
      # for a measurement when its question has just gone red on them
      - briefs/evidence/define.cry-wolf-measurements.md
      # ⚠️ the long half of rule.require.one-command-provision, which is say-level.
      # the say half states the bar, the test, the enforcement, and a one-line
      # catalogue of the ten defect shapes; this file holds each shape in full,
      # with the measurement that found it. a reader reaches for it when they have
      # hit a shape — never every session, which is why the split exists
      - briefs/grove/provision/define.provision-defect-shapes.md
      # ⚠️ ref-level on purpose, and it is the ONE rule here whose say-level copy
      # is not a brief: the full argument sits inline in `src/termwork.sh`, above
      # the three launches, because that is the file an author edits when they
      # widen the grant. this brief holds the values table and the measurement,
      # for the reader who wants the case rather than the verdict
      - briefs/creds/rule.require.narrowest-terminal-grant.md
      # nvim config + specs
      - briefs/desktop/nvim/nvim.md
      - briefs/desktop/nvim/nvim.minimap.spec.md
      - briefs/desktop/nvim/nvim.gitsigns-minimap.spec.md
      - briefs/desktop/nvim/nvim.highlights.gitsigns.md
      - briefs/desktop/nvim/nvim.highlights.neominimap.md
      - briefs/desktop/nvim/nvim.neominimap.custom-handler.md
      - briefs/desktop/nvim/nvim.treesitter.markdown-injection.spec.md
      - briefs/desktop/nvim/nvim.treesitter.parser-error.md
      - briefs/desktop/nvim/criteria/codediff.explorer.collapse.md
      - briefs/desktop/nvim/criteria/codediff.explorer.width.md
      - briefs/desktop/nvim/criteria/codediff.keymaps.md
      - briefs/desktop/nvim/criteria/diff.boundary.nav.md
      - briefs/desktop/nvim/diff-boundary-nav.md
      # system specs + power
      - briefs/desktop/system/system.power.spec.md
      - briefs/desktop/system/system.power.howto.md
      - briefs/desktop/system/system.runaway_monitor.spec.md
      # diagnostic + setup howtos
      - briefs/desktop/nvim/howto.diagnose-nvim-hang.md
      - briefs/desktop/system/howto.diagnose-wayland-client-death.md
      - briefs/desktop/system/howto.fix-apple-magic-device-bluetooth.md
      - briefs/desktop/term/howto.headless-terminal-streams.md
      - briefs/desktop/term/howto.terminal-window-management.md
      - briefs/desktop/term/howto.termwork-roundtrip.md
      - briefs/grove/provision/howto.setup-from-worktree.md
      - briefs/shell/gotcha.shell-snapshotter-underscore-prefix.md
      # theme + persona
      - briefs/desktop/term/theme.desert.md
      - briefs/im_a.ghlitch_blackcat.md
  skills:
    say:
      - skills/machine.diagnose.lag.sh
      - skills/nvim.diagnose.runaway.sh
      - skills/use.apikeys.sh
